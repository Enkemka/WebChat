<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="settings.css">
</head>
<body>
    <div class="settings-container">
        <aside class="sidebar">
            <ul>
                <li class="active" data-tab="account">Account</li>
                <li data-tab="security">Security</li>
                <li data-tab="notifications">Notifications</li>
            </ul>
        </aside>
        <main class="settings-main">
            <!-- Account Tab -->
            <div class="tab-content active" id="account">
                <h2>Account Settings</h2>
                <form id="accountForm">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter username">

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter email">

                    <button type="submit">Save Changes</button>
                </form>
            </div>

            <!-- Security Tab -->
            <div class="tab-content" id="security">
                <h2>Security Settings</h2>
                <form id="securityForm">
                    <label for="currentPassword">Current Password</label>
                    <input type="password" id="currentPassword" name="currentPassword" placeholder="Enter current password">

                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password">

                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm new password">

                    <button type="submit">Update Password</button>
                </form>
            </div>

            <!-- Notifications Tab -->
            <div class="tab-content" id="notifications">
                <h2>Notification Settings</h2>
                <form id="notificationsForm">
                    <label>
                        <input type="checkbox" name="emailNotifications" checked>
                        Email Notifications
                    </label>
                    <label>
                        <input type="checkbox" name="smsNotifications">
                        SMS Notifications
                    </label>
                    <label>
                        <input type="checkbox" name="pushNotifications" checked>
                        Push Notifications
                    </label>
                    <button type="submit">Save Preferences</button>
                </form>
            </div>
        </main>
    </div>

    <script src="settings.js"></script>
</body>
</html>
